<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHONNYBALL - Celebrity Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { 
            display: block; 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        
        /* Top bar */
        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .logo { color: #fff; font-weight: bold; font-size: 1.2em; }
        .logo span { color: #ff3366; }
        .status { color: #4ade80; font-size: 0.8em; }
        .status.recording { color: #ff0000; animation: pulse 0.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        
        /* Bottom controls */
        .controls {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: rgba(255,255,255,0.2); }
        button.record-btn { background: #ff3366; border-color: #ff3366; }
        button.record-btn.recording { background: #ff0000; }
        select {
            padding: 8px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            font-size: 0.8em;
            cursor: pointer;
        }
        select option { background: #1a1a2e; color: #fff; }
        .timer { color: #ffd700; font-weight: bold; font-size: 0.9em; min-width: 50px; text-align: center; }
        
        /* Hidden inputs */
        #musicInput, #imageInput { display: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="top-bar">
        <div class="logo">JHONNY<span>BALL</span> 🏆</div>
        <div class="status" id="status">LIVE</div>
    </div>
    
    <div class="controls">
        <button id="pauseBtn">⏯️ Pause</button>
        <button id="resetBtn">↺ Reset</button>
        <select id="durationSelect">
            <option value="7">7 sec</option>
            <option value="30" selected>30 sec</option>
            <option value="60">1 min</option>
            <option value="120">2 min</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
        </select>
        <button class="record-btn" id="recordBtn">⏺ Record</button>
        <span class="timer" id="timer">00:00</span>
        <button id="addBtn">➕ Add</button>
        <button id="clearBtn">🗑 Clear</button>
        <button id="musicBtn">🎵 Music</button>
        <button id="imageBtn">🖼️ Images</button>
        <input type="range" id="speedSlider" min="1" max="20" value="7" style="width:80px;">
    </div>
    
    <input type="file" id="musicInput" accept="audio/*">
    <input type="file" id="imageInput" accept="image/*" multiple>
    
    <script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // State
        let balls = [];
        let paused = false;
        let recording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingTimer = null;
        let recordingTimeLeft = 30;
        let recordingDuration = 30;
        let audioElement = null;
        let isMusicPlaying = false;
        let customImages = [];
        let isDragging = false;
        let dragBall = null;
        let dragStartX = 0, dragStartY = 0;
        
        // Arena
        let cx, cy, radius;
        
        // Celebrities
        const celebs = [
            { name: 'Elon Musk', emoji: '🚀', color: '#ff6b6b' },
            { name: 'Ronaldo', emoji: '⚽', color: '#4ecdc4' },
            { name: 'Messi', emoji: '🐐', color: '#a29bfe' },
            { name: 'MrBeast', emoji: '💰', color: '#fd79a8' },
            { name: 'Taylor Swift', emoji: '🎤', color: '#ffeaa7' },
            { name: 'Drake', emoji: '🎵', color: '#74b9ff' },
            { name: 'Kim K', emoji: '💋', color: '#fab1a0' },
            { name: 'Trump', emoji: '🦅', color: '#ff7675' },
            { name: 'Biden', emoji: '🏛️', color: '#81ecec' },
            { name: 'Zuckerberg', emoji: '🤖', color: '#55efc4' },
            { name: 'Jeff Bezos', emoji: '📦', color: '#dfe6e9' },
            { name: 'Putin', emoji: '🐻', color: '#b2bec3' },
        ];
        
        // Ball class
        class Ball {
            constructor(x, y, vx, vy, celeb, img) {
                this.x = x;
                this.y = y;
                this.vx = vx || (Math.random() - 0.5) * 5;
                this.vy = vy || (Math.random() - 0.5) * 5;
                this.celeb = celeb;
                this.img = img;
                this.radius = 35;
                this.alive = true;
            }
            
            update(speed) {
                if (!this.alive || paused) return;
                const f = speed / 7;
                this.x += this.vx * f;
                this.y += this.vy * f;
                
                // Circle boundary
                const dx = this.x - cx;
                const dy = this.y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = radius - this.radius;
                
                if (dist > maxDist && dist > 0) {
                    const nx = dx/dist;
                    const ny = dy/dist;
                    const dot = this.vx*nx + this.vy*ny;
                    this.vx -= 2*dot*nx;
                    this.vy -= 2*dot*ny;
                    this.x = cx + nx*maxDist;
                    this.y = cy + ny*maxDist;
                    
                    const s = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                    if (s > 10) { this.vx = (this.vx/s)*10; this.vy = (this.vy/s)*10; }
                }
                
                // Ball collision
                for (let b of balls) {
                    if (b === this || !b.alive) continue;
                    const ddx = this.x - b.x;
                    const ddy = this.y - b.y;
                    const dd = Math.sqrt(ddx*ddx + ddy*ddy);
                    if (dd < this.radius + b.radius && dd > 0) {
                        const overlap = this.radius + b.radius - dd;
                        const nx2 = ddx/dd;
                        const ny2 = ddy/dd;
                        this.x += nx2*overlap/2;
                        this.y += ny2*overlap/2;
                        b.x -= nx2*overlap/2;
                        b.y -= ny2*overlap/2;
                        [this.vx, b.vx] = [b.vx, this.vx];
                        [this.vy, b.vy] = [b.vy, this.vy];
                    }
                }
            }
            
            draw(ctx) {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 8;
                
                // Draw image or colored circle
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                
                if (this.img && this.img.complete && this.img.naturalWidth > 0) {
                    ctx.clip();
                    ctx.drawImage(this.img, -this.radius, -this.radius, this.radius*2, this.radius*2);
                } else {
                    ctx.fillStyle = this.celeb.color;
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = `${this.radius*1.1}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.celeb.emoji, 0, -5);
                }
                
                // Border
                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.stroke();
                
                // Name
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${this.radius*0.28}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(this.celeb.name, 0, this.radius + 12);
                
                ctx.restore();
            }
            
            hitTest(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                return Math.sqrt(dx*dx + dy*dy) < this.radius + 5;
            }
        }
        
        // Resize
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width/2;
            cy = canvas.height/2;
            radius = Math.min(canvas.width, canvas.height) * 0.38;
            
            // Keep balls inside
            for (let b of balls) {
                const dx = b.x - cx;
                const dy = b.y - cy;
                const d = Math.sqrt(dx*dx + dy*dy);
                if (d > radius - b.radius && d > 0) {
                    b.x = cx + (dx/d)*(radius - b.radius);
                    b.y = cy + (dy/d)*(radius - b.radius);
                }
            }
        }
        
        // Spawn ball
        function spawnBall(x, y, vx, vy) {
            if (balls.length >= 40) return;
            const sx = x || cx + (Math.random()-0.5)*radius*0.5;
            const sy = y || cy + (Math.random()-0.5)*radius*0.5;
            const celeb = celebs[Math.floor(Math.random()*celebs.length)];
            const img = customImages.length > 0 ? customImages[Math.floor(Math.random()*customImages.length)] : null;
            balls.push(new Ball(sx, sy, vx, vy, celeb, img));
        }
        
        // Draw arena
        function drawArena() {
            // Fill
            const grad = ctx.createRadialGradient(cx, cy, radius*0.7, cx, cy, radius);
            grad.addColorStop(0, 'rgba(20,22,40,0.5)');
            grad.addColorStop(1, 'rgba(255,51,102,0.05)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.fill();
            
            // Border
            ctx.strokeStyle = 'rgba(255,51,102,0.6)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        
        // Recording
        function startRecording() {
            if (!canvas.captureStream) {
                alert('Recording not supported in this browser');
                return;
            }
            
            recordedChunks = [];
            const stream = canvas.captureStream(60);
            
            // Add audio if playing
            let finalStream = stream;
            if (audioElement && isMusicPlaying) {
                try {
                    const audioCtx = new AudioContext();
                    const source = audioCtx.createMediaElementSource(audioElement);
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    if (audioTrack) {
                        finalStream = new MediaStream([...stream.getVideoTracks(), audioTrack]);
                    }
                } catch(e) {}
            }
            
            try {
                mediaRecorder = new MediaRecorder(finalStream, {
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 8000000
                });
            } catch(e) {
                mediaRecorder = new MediaRecorder(finalStream, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: 8000000
                });
            }
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `jhonyball-${Date.now()}.mp4`;
                a.click();
                URL.revokeObjectURL(url);
                cleanupRecording();
            };
            
            mediaRecorder.start(1000);
            recording = true;
            recordingTimeLeft = recordingDuration;
            
            document.getElementById('recordBtn').textContent = '⏹ Stop';
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('status').textContent = '🔴 REC';
            document.getElementById('status').classList.add('recording');
            
            updateTimer();
            recordingTimer = setInterval(() => {
                recordingTimeLeft--;
                updateTimer();
                if (recordingTimeLeft <= 0) stopRecording();
            }, 1000);
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                cleanupRecording();
            }
        }
        
        function cleanupRecording() {
            recording = false;
            if (recordingTimer) clearInterval(recordingTimer);
            document.getElementById('recordBtn').textContent = '⏺ Record';
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('status').textContent = 'LIVE';
            document.getElementById('status').classList.remove('recording');
            document.getElementById('timer').textContent = '00:00';
        }
        
        function updateTimer() {
            const m = Math.floor(recordingTimeLeft/60);
            const s = recordingTimeLeft % 60;
            document.getElementById('timer').textContent = 
                String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        
        // Animation
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawArena();
            
            const speed = parseInt(document.getElementById('speedSlider').value);
            for (let b of balls) b.update(speed);
            for (let b of balls) b.draw(ctx);
            
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            // Check if clicking a ball
            for (let i = balls.length-1; i >= 0; i--) {
                if (balls[i].hitTest(mx, my)) {
                    dragBall = balls[i];
                    isDragging = true;
                    dragStartX = mx;
                    dragStartY = my;
                    dragBall.vx = 0;
                    dragBall.vy = 0;
                    return;
                }
            }
            
            // Add new ball
            if (Math.sqrt((mx-cx)**2 + (my-cy)**2) < radius - 35) {
                spawnBall(mx, my);
            }
        });
        
        canvas.addEventListener('mousemove', e => {
            if (!isDragging || !dragBall) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const dx = mx - cx;
            const dy = my - cy;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < radius - dragBall.radius) {
                dragBall.x = mx;
                dragBall.y = my;
            } else {
                dragBall.x = cx + (dx/d)*(radius - dragBall.radius);
                dragBall.y = cy + (dy/d)*(radius - dragBall.radius);
            }
        });
        
        canvas.addEventListener('mouseup', e => {
            if (isDragging && dragBall) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                dragBall.vx = (mx - dragStartX) * 0.3;
                dragBall.vy = (my - dragStartY) * 0.3;
            }
            isDragging = false;
            dragBall = null;
        });
        
        // Touch support
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
        });
        canvas.addEventListener('touchend', () => canvas.dispatchEvent(new MouseEvent('mouseup')));
        
        // Buttons
        document.getElementById('pauseBtn').addEventListener('click', function() {
            paused = !paused;
            this.textContent = paused ? '▶️ Play' : '⏯️ Pause';
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            balls = [];
            for (let i = 0; i < 5; i++) spawnBall();
        });
        
        document.getElementById('durationSelect').addEventListener('change', function() {
            recordingDuration = parseInt(this.value);
        });
        
        document.getElementById('recordBtn').addEventListener('click', () => {
            recording ? stopRecording() : startRecording();
        });
        
        document.getElementById('addBtn').addEventListener('click', () => spawnBall());
        document.getElementById('clearBtn').addEventListener('click', () => { balls = []; });
        
        document.getElementById('musicBtn').addEventListener('click', () => {
            document.getElementById('musicInput').click();
