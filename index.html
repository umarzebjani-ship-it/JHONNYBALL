<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHONNYBALL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a14; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%;
        }
        .ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.85);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { background: rgba(255,255,255,0.2); }
        button.rec { background: #e94560; border-color: #e94560; }
        button.rec.recording { background: red; animation: pulse 0.8s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }
        #timer { color: #ffd700; font-weight: bold; font-size: 16px; min-width: 50px; text-align: center; display: flex; align-items: center; }
        #status { position: fixed; top: 20px; right: 20px; color: #4ade80; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 15px; }
        #status.recording { color: red; }
        select { padding: 8px; border-radius: 15px; background: #1a1a2e; color: white; border: 1px solid rgba(255,255,255,0.3); }
        input[type="range"] { width: 80px; accent-color: #e94560; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="status">🟢 LIVE</div>
    
    <div class="ui">
        <button id="pauseBtn">⏯️ Pause</button>
        <button id="resetBtn">↺ Reset</button>
        <select id="durationSelect">
            <option value="7">7 sec</option>
            <option value="30" selected>30 sec</option>
            <option value="60">1 min</option>
            <option value="120">2 min</option>
            <option value="300">5 min</option>
            <option value="600">10 min</option>
        </select>
        <button class="rec" id="recordBtn">⏺ Record</button>
        <span id="timer">00:00</span>
        <button id="addBtn">➕ Add</button>
        <button id="clearBtn">🗑 Clear</button>
        <button id="musicBtn">🎵 Music</button>
        <input type="range" id="speedSlider" min="1" max="20" value="7" title="Speed">
        <span style="color:#aaa;font-size:12px;">Speed</span>
    </div>
    
    <input type="file" id="musicInput" accept="audio/*" class="hidden">
    <input type="file" id="imageInput" accept="image/*" multiple class="hidden">

    <script>
    // Wrap everything in try-catch to prevent silent errors
    try {
        console.log('🚀 Starting JHONNYBALL...');
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        console.log('✅ Canvas initialized:', canvas.width, canvas.height);
        
        // Simple ball array
        let balls = [];
        let paused = false;
        let recording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingTimer = null;
        let recordingTimeLeft = 30;
        let recordingDuration = 30;
        let isDragging = false;
        let dragBall = null;
        let dragStartX = 0, dragStartY = 0;
        let audioElement = null;
        
        // Arena dimensions
        let cx, cy, radius;
        
        // Celebrity data
        const celebs = [
            { name: 'Elon', emoji: '🚀', color: '#ff4444' },
            { name: 'Ronaldo', emoji: '⚽', color: '#44ff44' },
            { name: 'Messi', emoji: '🐐', color: '#4444ff' },
            { name: 'MrBeast', emoji: '💰', color: '#ff44ff' },
            { name: 'Taylor', emoji: '🎤', color: '#ffff44' },
            { name: 'Drake', emoji: '🎵', color: '#44ffff' },
        ];
        
        // Ball class - SIMPLE AND CLEAN
        class Ball {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.celeb = celebs[Math.floor(Math.random() * celebs.length)];
                this.radius = 30;
            }
            
            update(speed) {
                if (paused) return;
                const f = speed / 7;
                this.x += this.vx * f;
                this.y += this.vy * f;
                
                // Bounce off circle boundary
                const dx = this.x - cx;
                const dy = this.y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = radius - this.radius;
                
                if (dist > maxDist) {
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const dot = this.vx*nx + this.vy*ny;
                    this.vx -= 2*dot*nx;
                    this.vy -= 2*dot*ny;
                    this.x = cx + nx*maxDist;
                    this.y = cy + ny*maxDist;
                }
                
                // Ball-to-ball collision
                for (let b of balls) {
                    if (b === this) continue;
                    const ddx = this.x - b.x;
                    const ddy = this.y - b.y;
                    const dd = Math.sqrt(ddx*ddx + ddy*ddy);
                    if (dd < this.radius + b.radius && dd > 0) {
                        const overlap = this.radius + b.radius - dd;
                        this.x += (ddx/dd) * overlap/2;
                        this.y += (ddy/dd) * overlap/2;
                        b.x -= (ddx/dd) * overlap/2;
                        b.y -= (ddy/dd) * overlap/2;
                        [this.vx, b.vx] = [b.vx, this.vx];
                        [this.vy, b.vy] = [b.vy, this.vy];
                    }
                }
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Draw circle
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                grad.addColorStop(0, this.celeb.color);
                grad.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fill();
                
                // Border
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.stroke();
                
                // Emoji
                ctx.fillStyle = '#fff';
                ctx.font = '28px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.celeb.emoji, 0, -4);
                
                // Name
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.fillText(this.celeb.name, 0, this.radius + 14);
                
                ctx.restore();
            }
            
            hitTest(px, py) {
                return Math.hypot(px - this.x, py - this.y) < this.radius + 5;
            }
        }
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            radius = Math.min(canvas.width, canvas.height) * 0.4;
            console.log('📐 Resized:', cx, cy, radius);
        }
        
        function spawnBall(x, y) {
            if (balls.length >= 30) return;
            const bx = x || cx + (Math.random()-0.5)*radius*0.5;
            const by = y || cy + (Math.random()-0.5)*radius*0.5;
            balls.push(new Ball(bx, by));
            console.log('🏀 Ball spawned! Total:', balls.length);
        }
        
        function initBalls() {
            balls = [];
            for (let i = 0; i < 5; i++) {
                spawnBall();
            }
            console.log('🎱 Initialized', balls.length, 'balls');
        }
        
        // Recording functions
        function startRecording() {
            if (!canvas.captureStream) {
                alert('Recording not supported');
                return;
            }
            
            recordedChunks = [];
            const stream = canvas.captureStream(60);
            
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            } catch(e) {
                mediaRecorder = new MediaRecorder(stream);
            }
            
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `jhonyball-${Date.now()}.mp4`;
                a.click();
                URL.revokeObjectURL(url);
                stopRecordingUI();
            };
            
            mediaRecorder.start(1000);
            recording = true;
            recordingTimeLeft = recordingDuration;
            recordingTimer = setInterval(() => {
                recordingTimeLeft--;
                document.getElementById('timer').textContent = 
                    String(Math.floor(recordingTimeLeft/60)).padStart(2,'0') + ':' + 
                    String(recordingTimeLeft%60).padStart(2,'0');
                if (recordingTimeLeft <= 0) stopRecording();
            }, 1000);
            
            document.getElementById('recordBtn').textContent = '⏹ Stop';
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('status').textContent = '🔴 REC';
            document.getElementById('status').classList.add('recording');
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                stopRecordingUI();
            }
        }
        
        function stopRecordingUI() {
            recording = false;
            if (recordingTimer) clearInterval(recordingTimer);
            document.getElementById('recordBtn').textContent = '⏺ Record';
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('status').textContent = '🟢 LIVE';
            document.getElementById('status').classList.remove('recording');
            document.getElementById('timer').textContent = '00:00';
        }
        
        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw arena circle
            ctx.strokeStyle = 'rgba(233,68,96,0.6)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#e94560';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // Fill arena
            ctx.fillStyle = 'rgba(20,20,40,0.3)';
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.fill();
            
            // Update and draw balls
            const speed = parseInt(document.getElementById('speedSlider').value) || 7;
            for (let ball of balls) {
                ball.update(speed);
                ball.draw(ctx);
            }
            
            // Log ball count occasionally
            if (Math.random() < 0.01) {
                console.log('🎯 Frame - Balls:', balls.length, 'Paused:', paused);
            }
            
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            // Check for drag
            for (let i = balls.length-1; i >= 0; i--) {
                if (balls[i].hitTest(mx, my)) {
                    dragBall = balls[i];
                    isDragging = true;
                    dragStartX = mx;
                    dragStartY = my;
                    dragBall.vx = 0;
                    dragBall.vy = 0;
                    console.log('👆 Grabbed ball:', dragBall.celeb.name);
                    return;
                }
            }
            
            // Spawn new ball
            if (Math.hypot(mx-cx, my-cy) < radius - 30) {
                spawnBall(mx, my);
            }
        });
        
        canvas.addEventListener('mousemove', e => {
            if (!isDragging || !dragBall) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const dx = mx - cx;
            const dy = my - cy;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < radius - dragBall.radius) {
                dragBall.x = mx;
                dragBall.y = my;
            }
        });
        
        canvas.addEventListener('mouseup', e => {
            if (isDragging && dragBall) {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                dragBall.vx = (mx - dragStartX) * 0.3;
                dragBall.vy = (my - dragStartY) * 0.3;
                console.log('🏌️ Fling! Velocity:', dragBall.vx.toFixed(1), dragBall.vy.toFixed(1));
            }
            isDragging = false;
            dragBall = null;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            dragBall = null;
        });
        
        // Touch support
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
        }, {passive: false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
        }, {passive: false});
        canvas.addEventListener('touchend', () => {
            canvas.dispatchEvent(new MouseEvent('mouseup'));
        });
        
        // Button controls
        document.getElementById('pauseBtn').addEventListener('click', function() {
            paused = !paused;
            this.textContent = paused ? '▶️ Play' : '⏯️ Pause';
            console.log('⏯️ Paused:', paused);
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            initBalls();
            console.log('🔄 Reset');
        });
        
        document.getElementById('durationSelect').addEventListener('change', function() {
            recordingDuration = parseInt(this.value);
            console.log('⏱ Duration:', recordingDuration, 'sec');
        });
        
        document.getElementById('recordBtn').addEventListener('click', () => {
            recording ? stopRecording() : startRecording();
        });
        
        document.getElementById('addBtn').addEventListener('click', () => spawnBall());
        document.getElementById('clearBtn').addEventListener('click', () => {
            balls = [];
            console.log('🗑 Cleared all balls');
        });
        
        document.getElementById('musicBtn').addEventListener('click', () => {
            document.getElementById('musicInput').click();
        });
        
        document.getElementById('musicInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (audioElement) { audioElement.pause(); }
            audioElement = new Audio(URL.createObjectURL(file));
            audioElement.loop = true;
            audioElement.volume = 0.7;
            audioElement.play().catch(e => console.log('🔇 Autoplay blocked'));
            console.log('🎵 Music loaded:', file.name);
        });
        
        // Keyboard
        window.addEventListener('keydown', e => {
            switch(e.key) {
                case ' ': e.preventDefault(); paused = !paused; 
                    document.getElementById('pauseBtn').textContent = paused ? '▶️ Play' : '⏯️ Pause'; break;
                case 'r': initBalls(); break;
                case 'c': balls = []; break;
                case 'a': spawnBall(); break;
            }
        });
        
        // START EVERYTHING
        resize();
        initBalls();
        animate();
        
        console.log('✅ JHONNYBALL is running!');
        console.log('📊 Canvas:', canvas.width+'x'+canvas.height);
        console.log('🎯 Arena center:', cx, cy, 'Radius:', radius);
        console.log('🏀 Balls:', balls.length);
        console.log('🖱️ Click canvas to add balls, drag to fling them!');
        
    } catch(error) {
        console.error('❌ ERROR:', error.message);
        console.error('Stack:', error.stack);
        alert('Error: ' + error.message + '\n\nCheck console (F12) for details');
    }
    </script>
</body>
</html>
