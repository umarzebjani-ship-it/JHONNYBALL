<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHONNYBALL – Celebrity Contest Simulator</title>
    <style>
        :root {
            --bg: #0a0a14;
            --accent: #ff3366;
            --accent2: #00d4ff;
            --gold: #ffb800;
            --green: #4ade80;
            --purple: #a855f7;
            --panel: rgba(10, 10, 20, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #06060e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #appContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #appContainer.desktop-view {
            width: 100%;
            height: 100%;
        }
        #appContainer.mobile-view {
            width: 390px;
            height: 844px;
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 0 8px #1a1a2e, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.8);
        }
        #appContainer.fullscreen-view {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #06060e;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ============ VIEW SELECTOR ============ */
        #viewSelector {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: var(--panel);
            border-radius: 25px;
            padding: 5px;
            display: flex;
            gap: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .view-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: #999;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78em;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .view-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.08);
        }
        .view-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,51,102,0.4);
        }

        /* ============ TOP BAR ============ */
        #topBar {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 60%, transparent 100%);
            pointer-events: none;
            transition: top 0.3s;
        }
        #topBar>* {
            pointer-events: auto;
        }
        #logo {
            font-size: 1.3em;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }
        #logo span {
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #statusDot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 6px;
            box-shadow: 0 0 8px #4ade80;
            vertical-align: middle;
            transition: all 0.3s;
        }
        #statusDot.recording {
            background: #ff0000;
            box-shadow: 0 0 12px #ff0000;
            animation: dotPulse 0.6s infinite;
        }
        @keyframes dotPulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #statusText {
            color: #ccc;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ============ CONTEST LEADERBOARD ============ */
        #leaderboard {
            position: absolute;
            top: 110px;
            right: 16px;
            z-index: 100;
            background: var(--panel);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-width: 160px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        #leaderboard.visible {
            display: block;
        }
        #leaderboard h3 {
            color: var(--gold);
            font-size: 0.8em;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .lb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            color: #ccc;
            font-size: 0.7em;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lb-rank {
            font-weight: 700;
            color: var(--gold);
            width: 18px;
        }
        .lb-name {
            flex: 1;
        }
        .lb-score {
            color: var(--accent2);
            font-weight: 600;
        }
        .lb-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--accent);
            transition: width 0.5s;
        }

        /* ============ CONTEST MODE PANEL ============ */
        #contestPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            background: var(--panel);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: none;
            flex-direction: column;
            gap: 12px;
            min-width: 300px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        #contestPanel.visible {
            display: flex;
        }
        #contestPanel h3 {
            color: var(--gold);
            text-align: center;
            font-size: 1em;
            letter-spacing: 1px;
        }
        .contest-option {
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.03);
            color: #ddd;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78em;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
            width: 100%;
        }
        .contest-option:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent2);
            color: #fff;
        }
        .contest-option.active-contest {
            background: rgba(168,85,247,0.2);
            border-color: var(--purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(168,85,247,0.3);
        }
        .contest-close {
            padding: 8px;
            background: rgba(255,51,102,0.2);
            border: 1px solid var(--accent);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75em;
            text-align: center;
            font-family: inherit;
        }

        /* ============ DURATION SELECTOR ============ */
        #durationPanel {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            background: var(--panel);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.25s ease;
            opacity: 1;
            pointer-events: auto;
        }
        #durationPanel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(-8px);
        }
        .dur-btn {
            padding: 7px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #bbb;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7em;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: inherit;
        }
        .dur-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .dur-btn.active {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #fff;
            box-shadow: 0 0 14px rgba(0,212,255,0.35);
        }

        /* ============ FRAME SELECTOR MODAL ============ */
        #frameModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        #frameModal.visible {
            display: flex;
        }
        #framePreview {
            max-width: 90vw;
            max-height: 50vh;
            border-radius: 12px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(255,51,102,0.3);
        }
        #frameCanvas {
            display: none;
        }
        .frame-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .frame-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 1px;
            font-family: inherit;
            transition: all 0.3s;
        }
        .frame-btn.download {
            background: var(--green);
            color: #000;
        }
        .frame-btn.download:hover {
            box-shadow: 0 0 25px rgba(74,222,128,0.5);
        }
        .frame-btn.retry {
            background: var(--accent2);
            color: #000;
        }
        .frame-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #frameSlider {
            width: 300px;
            max-width: 80vw;
            accent-color: var(--accent);
        }
        .frame-time {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.9em;
        }

        /* ============ BOTTOM CONTROLS ============ */
        #controlsBar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: var(--panel);
            border-radius: 22px;
            padding: 8px 12px;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 95vw;
        }
        .btn {
            padding: 9px 14px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.04);
            color: #ddd;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75em;
            letter-spacing: 0.4px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
            color: #fff;
        }
        .btn.rec {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .btn.rec.active-rec {
            background: #ff0000;
            border-color: #ff0000;
            animation: recGlow 0.7s infinite;
        }
        @keyframes recGlow {
            0%,100% { box-shadow: 0 0 8px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 25px rgba(255,0,0,0.9); }
        }
        .btn.dur {
            background: rgba(0,212,255,0.15);
            border-color: rgba(0,212,255,0.4);
            color: var(--accent2);
        }
        .btn.music-btn {
            background: rgba(255,184,0,0.1);
            border-color: rgba(255,184,0,0.3);
            color: var(--gold);
        }
        .btn.music-btn.playing {
            background: rgba(74,222,128,0.2);
            border-color: rgba(74,222,128,0.5);
            color: #4ade80;
            box-shadow: 0 0 12px rgba(74,222,128,0.3);
        }
        .btn.contest-btn {
            background: rgba(168,85,247,0.2);
            border-color: rgba(168,85,247,0.4);
            color: var(--purple);
        }
        .btn.contest-btn:hover {
            box-shadow: 0 0 15px rgba(168,85,247,0.4);
        }
        .btn.lb-btn {
            background: rgba(255,184,0,0.1);
            border-color: rgba(255,184,0,0.3);
            color: var(--gold);
        }

        #timerDisplay {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.82em;
            min-width: 52px;
            text-align: center;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-variant-numeric: tabular-nums;
        }
        #timerDisplay.warn {
            color: #ff4444;
            animation: blink 0.4s infinite;
        }
        @keyframes blink { 50% { opacity: 0.2; } }
        #speedSlider {
            width: 55px;
            accent-color: var(--accent);
            height: 4px;
            cursor: pointer;
        }
        .speed-label {
            color: #999;
            font-size: 0.65em;
        }

        #musicInput, #imageInput {
            display: none;
        }

        /* Score popup */
        .score-popup {
            position: absolute;
            color: var(--gold);
            font-weight: 900;
            font-size: 1em;
            pointer-events: none;
            animation: scoreUp 1.5s forwards;
            z-index: 90;
        }
        @keyframes scoreUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        @media (max-width: 768px) {
            #controlsBar {
                padding: 6px 8px;
                gap: 3px;
                border-radius: 16px;
                bottom: 10px;
            }
            .btn {
                padding: 7px 10px;
                font-size: 0.68em;
                border-radius: 18px;
            }
            #contestPanel {
                min-width: 260px;
                padding: 15px;
                gap: 8px;
            }
            #leaderboard {
                right: 4px;
                min-width: 130px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
